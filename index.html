<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserve Africa — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A0F12;
    --dusk:#2B1240;
    --wine:#7A2247;
    --ember:#D9502C;
    --sun:#F4A93B;
    --gold:#F0B25E;
    --line:rgba(255,244,230,0.18);
    --muted:rgba(255,240,225,0.68);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body);
    background:linear-gradient(180deg, var(--dusk) 0%, var(--wine) 42%, var(--ember) 74%, #F2874A 100%);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    min-height:100vh;
    padding:48px 24px 32px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- Logo ---------- */
  .logo{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo svg{ height:64px; width:auto; }
  .logo-mark{ display:flex; }

  /* ---------- Center content ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    max-width:640px;
    width:100%;
    position:relative;
    z-index:2;
  }
  .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:'';
    width:20px;
    height:1px;
    background:rgba(240,178,94,0.55);
  }
  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(32px, 5vw, 52px);
    line-height:1.12;
    letter-spacing:-0.01em;
    margin-bottom:20px;
  }
  h1 em{
    font-style:normal;
    color:var(--gold);
  }
  .lead{
    font-size:16px;
    line-height:1.65;
    color:var(--muted);
    max-width:460px;
    margin:0 auto 36px;
  }
  .lead .placeholder-note{
    display:block;
    margin-top:10px;
    font-size:12.5px;
    color:rgba(255,255,255,0.38);
    font-style:italic;
  }

  /* ---------- Notify form ---------- */
  form{
    display:flex;
    gap:10px;
    width:100%;
    max-width:380px;
    margin:0 auto;
  }
  form input{
    flex:1;
    padding:13px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.08);
    color:#fff;
    font-family:var(--font-body);
    font-size:14px;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  form input::placeholder{ color:rgba(255,244,230,0.45); }
  form input:focus{ border-color:var(--sun); background:rgba(255,255,255,0.12); }
  form button{
    padding:13px 22px;
    border-radius:999px;
    border:none;
    background:var(--ink);
    color:var(--gold);
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .18s ease, transform .18s ease, color .18s ease;
  }
  form button:hover{ background:#000; color:#fff; transform:translateY(-1px); }
  .form-note{
    margin-top:14px;
    font-size:12px;
    color:rgba(255,255,255,0.4);
  }

  /* ---------- Horizon signature element ---------- */
  .horizon{
    position:absolute;
    left:50%;
    bottom:-160px;
    transform:translateX(-50%);
    width:min(1100px, 160vw);
    z-index:1;
    pointer-events:none;
  }
  .horizon svg{ width:100%; height:auto; display:block; }
  .sun{ animation: rise 5s ease-out forwards; transform-origin:center; }
  @keyframes rise{
    from{ transform:translateY(46px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .sun{ animation:none; }
  }

  footer{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:rgba(255,255,255,0.4);
    text-align:center;
  }
  footer a{ color:rgba(255,255,255,0.6); text-decoration:none; }
  footer a:hover{ color:#fff; }
  .footer-links{ display:flex; gap:18px; }

  @media (max-width:520px){
    form{ flex-direction:column; }
    form button{ width:100%; }
  }
</style>
</head>
<body>

<div class="logo">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" role="img" aria-label="Reserve Africa">
    <text x="150" y="40" fill="#FFFFFF" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="34" letter-spacing="1" text-anchor="middle">RESERVE</text>
    <text x="150" y="68" fill="#D7A44A" font-family="Space Grotesk, sans-serif" font-weight="500" font-size="18" letter-spacing="7" text-anchor="middle">AFRICA</text>
  </svg>
</div>

<main>
  <p class="eyebrow">Coming soon</p>
  <h1>Something new is on the <em>horizon</em> for the safari industry.</h1>
  <p class="lead">
      Customised rates, detailed accommodation data and effortless trip building - all in one platform,
      built for how safari agents actually work.</p>

  <form onsubmit="event.preventDefault(); this.querySelector('button').textContent='Thanks!';">
    <input type="email" placeholder="you@example.com" required>
    <button type="submit">Notify me</button>
  </form>
  <p class="form-note">No spam — just a note when we launch.</p>

  <div class="horizon" aria-hidden="true">
    <svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFE3A3"/>
          <stop offset="45%" stop-color="#F4A93B"/>
          <stop offset="100%" stop-color="#D9502C" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle class="sun" cx="600" cy="150" r="130" fill="url(#sunGlow)"/>
      <circle class="sun" cx="600" cy="150" r="62" fill="#FFDD9B"/>
      <path d="M0 168 Q 200 150 400 166 T 800 162 T 1200 170 V 260 H 0 Z" fill="#1A0F12"/>
      <path d="M0 178 Q 220 195 440 180 T 860 184 T 1200 178 V 260 H 0 Z" fill="#0D0709"/>
    </svg>
  </div>
</main>

<footer>
<!--  <div class="footer-links">-->
<!--    <a href="info@reserveafrica.com">Contact</a>-->
<!--    <a href="#">Privacy</a>-->
<!--  </div>-->
  <span>&copy; 2026 Reserve Africa. All rights reserved.</span>
</footer>

</body>
</html>
